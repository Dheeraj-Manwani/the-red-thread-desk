services:
  postgres:
    image: postgres:17-alpine
    container_name: manychat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: manychat
      POSTGRES_PASSWORD: manychat
      POSTGRES_DB: manychat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manychat -d manychat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
